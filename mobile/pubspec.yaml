name: mut_mobile
description: Local encrypted library and reader for Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  archive: ^4.3.0
  cryptography: ^2.9.0
  crypto: ^3.0.6
  xml: ^6.6.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfrx: ^2.6.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/mut.png
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
